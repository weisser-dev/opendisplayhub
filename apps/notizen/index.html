<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mrbd-web-app-capable" content="true"><meta name="theme-color" content="#000000"><title>Notizen</title><link rel="stylesheet" href="style.css"><script defer src="../../i18n.js"></script><script defer src="app.js"></script></head><body><main class="shell"><header><div class="mark"><img src="icon.svg" alt=""></div><div><span class="overline">OPENDISPLAYHUB</span><h1>Notizen</h1></div><label class="language-setting">Sprache <select class="language-select" aria-label="Sprache"><option value="de">Deutsch</option><option value="en">English</option></select></label></header><section id="home"><p class="intro">Ein Gedanke. Ein Moment.<br>Festgehalten.</p><button id="new" class="primary"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Notiz aufnehmen <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><div class="section-title"><h2>Deine Notizen</h2><span id="count"></span></div><label class="sr-only" for="search">Notizen suchen</label><input id="search" type="search" placeholder="Notizen suchen" autocomplete="off" hidden><div id="notes" class="notes"></div><p id="no-results" class="empty" hidden>Keine passende Notiz gefunden.</p><p id="empty" class="empty">Noch keine Notizen.<br>Halte deinen ersten Gedanken fest.</p></section><section id="editor" hidden><div class="section-title"><h2 id="editor-title">Neue Notiz</h2><button id="cancel" class="text-button">Abbrechen</button></div><p class="hint">Sprich über die Spracheingabe deiner Tastatur oder schreibe deine Notiz.</p><label class="field-label" for="note-title">Titel <span>optional</span></label><input id="note-title" maxlength="60" placeholder="Wird sonst automatisch erstellt" autocomplete="off"><label class="field-label" for="note-text">Notiz</label><textarea id="note-text" placeholder="Was möchtest du festhalten?" rows="5"></textarea><button id="dictate" class="dictate" hidden>Spracheingabe starten</button><p id="speech-status" class="hint" role="status"></p><button id="save" class="primary">Notiz speichern <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><button id="delete" class="delete" hidden>Notiz löschen</button></section><p id="status" role="status"></p><footer>LOKAL GESPEICHERT</footer></main></body></html>
